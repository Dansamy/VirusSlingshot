<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Virus Slingshot</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Scanline effect for retro terminal feel */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Tooltip styling */
        #tooltip {
            position: absolute;
            background: rgba(0, 20, 0, 0.95);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 20;
            max-width: 300px;
            white-space: pre-wrap;
            box-shadow: 2px 2px 0px #000;
        }
        #tooltip strong {
            color: #fff;
            display: block;
            margin-bottom: 5px;
            border-bottom: 1px dashed #0f0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="tooltip"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');

        // Physics & Game Constants
        const FRICTION = 0.94;
        const MIN_VELOCITY = 0.15;
        const RADIUS = 16;
        const CHAR_SIZE = 18;
        const MAX_DRAG = 250;
        const LAUNCH_POWER = 0.12;

        // State Variables
        let width, height, cx, cy;
        let mapPolygon = [];
        let gameState = 'START'; // START, PLAYER_TURN, PLAYER_DRAG, MOVING, ENEMY_TURN, GAME_OVER, NEXT_LEVEL
        let currentLevel = 1;
        
        let entities = [];
        let particles = [];
        let deadParticles = []; // Permanent red ASCII specs
        let magmaGrid = [];
        let powerups = [];
        
        let player = null;
        let enemyQueue = [];
        let activeEnemy = null;

        let mouse = { x: 0, y: 0 };
        let dragStart = { x: 0, y: 0 };
        let hoveredEntity = null;
        let globalTick = 0;

        const ENEMY_DEFS = {
            'E': { cost: 1, desc: "Básico. 1 lanzamiento. Potencia normal.", power: 1.0, moves: 1 },
            'R': { cost: 2, desc: "Fuerte. 1 lanzamiento. Mayor potencia.", power: 1.6, moves: 1 },
            'O': { cost: 3, desc: "Escudo. Anula el primer empuje recibido.", power: 1.0, moves: 1, shield: true },
            'X': { cost: 2, desc: "Explosivo. Explota si estás cerca al detenerse.", power: 1.0, moves: 1, radius: 120 },
            'Y': { cost: 3, desc: "Divisor. Se divide en dos { I } al ser golpeado.", power: 1.0, moves: 1 },
            'I': { cost: 0, desc: "Fragmento. Débil. Potencia baja.", power: 0.5, moves: 1 },
            'H': { cost: 3, desc: "Protector. Inmuniza aliados en su rango verde.", power: 1.0, moves: 1, aura: 150 },
            'U': { cost: 3, desc: "Soporte. Da escudos a aliados en rango al detenerse.", power: 1.0, moves: 1, aura: 150 },
            '10':{ cost: 5, desc: "Tanque. Inmune a empuje hasta reducir su número a 1.", power: 1.0, moves: 1, hp: 10 },
            'S': { cost: 3, desc: "Serpiente. Movimiento curvo. Atraviesa enemigos.", power: 1.4, moves: 1, isSnake: true }
        };

        const POWERUP_DEFS = {
            '*': { name: "Overdrive", desc: "No rebotas al chocar. Atraviesas enemigos y los empujas." },
            'x': { name: "Bomba", desc: "Aura roja. Al detenerte, empuja enemigos fuera del rango." },
            '^': { name: "Doble Turno", desc: "Permite tener dos lanzamientos este turno." },
            'o': { name: "Escudo", desc: "Inmune a empujes enemigos durante su turno." }
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            if (gameState === 'START') generateMapAndMagma();
        }
        window.addEventListener('resize', resize);

        function generateMapAndMagma() {
            mapPolygon = [];
            let points = 14;
            let baseRadius = Math.min(width, height) * 0.35;
            
            // Generate a jagged polygon
            for (let i = 0; i < points; i++) {
                let angle = (i / points) * Math.PI * 2;
                // Deform to make it somewhat square/irregular
                let mod = Math.abs(Math.cos(angle * 2)) * 0.4 + 0.6;
                let r = baseRadius * mod + (Math.random() * 80 - 40); 
                mapPolygon.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
            }

            // Magma Grid
            magmaGrid = [];
            let cols = Math.ceil(width / (CHAR_SIZE * 1.5));
            let rows = Math.ceil(height / (CHAR_SIZE * 1.5));
            let chars = "01#$%&@*+/\\~";
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    magmaGrid.push({
                        x: c * (CHAR_SIZE * 1.5),
                        y: r * (CHAR_SIZE * 1.5),
                        char: chars[Math.floor(Math.random() * chars.length)],
                        offset: Math.random() * 100
                    });
                }
            }
        }

        function isPointInPoly(pt) {
            let inside = false;
            for (let i = 0, j = mapPolygon.length - 1; i < mapPolygon.length; j = i++) {
                let xi = mapPolygon[i].x, yi = mapPolygon[i].y;
                let xj = mapPolygon[j].x, yj = mapPolygon[j].y;
                let intersect = ((yi > pt.y) != (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function getRandomInsidePos(margin = RADIUS) {
            let pos, valid = false;
            let boundsR = Math.min(width, height) * 0.4;
            let limit = 0;
            while (!valid && limit < 200) {
                pos = {
                    x: cx + (Math.random() * boundsR * 2 - boundsR),
                    y: cy + (Math.random() * boundsR * 2 - boundsR)
                };
                if (isPointInPoly(pos)) {
                    valid = true;
                    // Check entity overlap
                    for (let e of entities) {
                        if (Math.hypot(e.x - pos.x, e.y - pos.y) < RADIUS * 2.5) valid = false;
                    }
                    for (let p of powerups) {
                        if (Math.hypot(p.x - pos.x, p.y - pos.y) < RADIUS * 2.5) valid = false;
                    }
                }
                limit++;
            }
            return pos || {x: cx, y: cy};
        }

        class Entity {
            constructor(x, y, type, isPlayer = false) {
                this.x = x; this.y = y;
                this.vx = 0; this.vy = 0;
                this.type = type;
                this.isPlayer = isPlayer;
                this.r = RADIUS;
                this.dead = false;
                
                this.movesLeft = 1;
                this.tick = 0; // For sine wave S enemy
                
                // Player Buffs
                this.hasOverdrive = false;
                this.hasBomb = false;
                this.bombRadius = 130;
                this.hasShield = false;
                
                if (!isPlayer && type) {
                    let def = ENEMY_DEFS[type];
                    this.power = def.power || 1;
                    this.movesLeft = def.moves || 1;
                    this.maxMoves = def.moves || 1;
                    this.hasShield = def.shield || false;
                    this.auraRadius = def.aura || 0;
                    this.dangerRadius = def.radius || 0;
                    this.hp = def.hp || 1;
                    this.isSnake = def.isSnake || false;
                }
            }
            
            isMoving() {
                return Math.abs(this.vx) > MIN_VELOCITY || Math.abs(this.vy) > MIN_VELOCITY;
            }

            draw() {
                ctx.save();
                
                // Draw Auras
                if (this.auraRadius > 0) {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.auraRadius, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.15)'; ctx.fill();
                    ctx.strokeStyle = '#0f0'; ctx.setLineDash([4, 4]); ctx.stroke();
                }
                if (this.dangerRadius > 0) {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.dangerRadius, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; ctx.fill();
                    ctx.strokeStyle = '#f00'; ctx.setLineDash([4, 4]); ctx.stroke();
                }
                if (this.isPlayer && this.hasBomb) {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.bombRadius, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; ctx.fill();
                    ctx.strokeStyle = '#f00'; ctx.setLineDash([4, 4]); ctx.stroke();
                }

                ctx.setLineDash([]);
                ctx.font = `bold ${CHAR_SIZE}px 'Courier New', monospace`;
                
                if (this.isPlayer) {
                    ctx.fillStyle = '#0ff';
                    let txt = this.hasShield ? '[@]' : ' @ ';
                    ctx.fillText(txt, this.x, this.y);
                    if (this.hasOverdrive) {
                        ctx.strokeStyle = '#ff0'; ctx.beginPath(); ctx.arc(this.x, this.y, this.r + 3, 0, Math.PI*2); ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = '#f00';
                    let dispType = this.type;
                    if (this.type === '10') dispType = this.hp;
                    let txt = this.hasShield ? `(${dispType})` : `{ ${dispType} }`;
                    ctx.fillText(txt, this.x, this.y);
                }
                ctx.restore();
            }
        }

        class Powerup {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.r = RADIUS - 4;
            }
            draw() {
                ctx.fillStyle = '#ff0';
                let size = CHAR_SIZE + Math.sin(globalTick * 0.1) * 3;
                ctx.font = `bold ${size}px 'Courier New', monospace`;
                ctx.fillText(this.type, this.x, this.y);
            }
        }

        function initLevel(resetScore = false) {
            if (resetScore) currentLevel = 1;
            
            entities = [];
            powerups = [];
            deadParticles = []; // Clear floor particles on new level
            
            player = new Entity(cx, cy + 40, null, true);
            entities.push(player);

            let diffTarget = 1 + (currentLevel - 1) * 2;
            let currentDiff = 0;
            
            // Filter out 'I' (only spawns from Y)
            let spawnable = Object.keys(ENEMY_DEFS).filter(k => k !== 'I');
            
            // Randomly pick enemies until diff is met
            let limit = 0;
            while (currentDiff < diffTarget && limit < 100) {
                let cType = spawnable[Math.floor(Math.random() * spawnable.length)];
                let def = ENEMY_DEFS[cType];
                
                // Extra conditions for H and U
                if (cType === 'H' || cType === 'U') {
                    if (currentDiff === 0) continue; // Only spawn if there are other enemies
                }

                if (currentDiff + def.cost <= diffTarget + 1) {
                    let pos = getRandomInsidePos();
                    entities.push(new Entity(pos.x, pos.y, cType));
                    currentDiff += def.cost;
                }
                limit++;
            }
            
            // Add remaining diff with basic enemies if needed
            while(currentDiff < diffTarget) {
                let pos = getRandomInsidePos();
                entities.push(new Entity(pos.x, pos.y, 'E'));
                currentDiff += ENEMY_DEFS['E'].cost;
            }

            // Move entities into auras if H or U exist
            let auraE = entities.filter(e => !e.isPlayer && (e.type === 'H' || e.type === 'U'));
            if (auraE.length > 0) {
                entities.forEach(e => {
                    if (!e.isPlayer && e.type !== 'H' && e.type !== 'U') {
                        let center = auraE[Math.floor(Math.random()*auraE.length)];
                        // Move closer to center
                        if (Math.random() > 0.3) {
                            let a = Math.random() * Math.PI * 2;
                            let dist = Math.random() * (center.auraRadius - RADIUS);
                            e.x = center.x + Math.cos(a)*dist;
                            e.y = center.y + Math.sin(a)*dist;
                        }
                    }
                });
            }

            // Spawn powerups
            let pCount = Math.min(4, Math.floor(currentLevel / 2) + 1);
            let pKeys = Object.keys(POWERUP_DEFS);
            for(let i = 0; i < pCount; i++) {
                let pos = getRandomInsidePos();
                powerups.push(new Powerup(pos.x, pos.y, pKeys[Math.floor(Math.random() * pKeys.length)]));
            }

            gameState = 'PLAYER_TURN';
            activeEnemy = null;
        }

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function handleDown(e) {
            if (gameState === 'START' || gameState === 'NEXT_LEVEL' || gameState === 'GAME_OVER') {
                initLevel(gameState === 'GAME_OVER');
                return;
            }
            if (gameState === 'PLAYER_TURN' && player) {
                let pos = getEventPos(e);
                if (Math.hypot(player.x - pos.x, player.y - pos.y) < RADIUS * 2.5) {
                    gameState = 'PLAYER_DRAG';
                    dragStart = { x: player.x, y: player.y };
                }
            }
        }

        function handleMove(e) {
            let pos = getEventPos(e);
            mouse.x = pos.x; mouse.y = pos.y;

            hoveredEntity = null;
            let all = [...entities, ...powerups];
            for (let obj of all) {
                if (Math.hypot(obj.x - mouse.x, obj.y - mouse.y) < RADIUS * 1.5) {
                    hoveredEntity = obj; break;
                }
            }
        }

        function handleUp(e) {
            if (gameState === 'PLAYER_DRAG' && player) {
                let dx = dragStart.x - mouse.x;
                let dy = dragStart.y - mouse.y;
                let dist = Math.hypot(dx, dy);

                if (dist > 10) {
                    if (dist > MAX_DRAG) {
                        dx = (dx / dist) * MAX_DRAG;
                        dy = (dy / dist) * MAX_DRAG;
                    }
                    
                    player.vx = dx * LAUNCH_POWER;
                    player.vy = dy * LAUNCH_POWER;
                    player.movesLeft--;
                    gameState = 'MOVING';
                } else {
                    gameState = 'PLAYER_TURN';
                }
            }
        }

        window.addEventListener('mousedown', handleDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchstart', handleDown, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleUp, {passive: false});

        function isProtectedByAura(entity) {
            if (entity.isPlayer || entity.type === 'H' || entity.type === 'U') return false;
            for (let e of entities) {
                if (e.type === 'H' && !e.dead && Math.hypot(e.x - entity.x, e.y - entity.y) <= e.auraRadius) {
                    return true;
                }
            }
            return false;
        }

        function spawnParticles(x, y, type, count, colors) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                    life: 1.0, decay: Math.random() * 0.05 + 0.02,
                    char: "01$*@#%"[Math.floor(Math.random()*7)],
                    color: colors[Math.floor(Math.random()*colors.length)]
                });
            }
        }
        
        function leaveDeadCorpse(x, y) {
            for(let i=0; i<4; i++) {
                deadParticles.push({
                    x: x + (Math.random() * 20 - 10),
                    y: y + (Math.random() * 20 - 10),
                    char: "xX*#"[Math.floor(Math.random()*4)]
                });
            }
        }

        function handleCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let a = entities[i]; let b = entities[j];
                    if (a.dead || b.dead) continue;

                    // Specific check for S: only collides with Player
                    if (a.isSnake && !b.isPlayer) continue;
                    if (b.isSnake && !a.isPlayer) continue;

                    let dx = b.x - a.x; let dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = a.r + b.r;

                    if (dist < minDist) {
                        let overlap = minDist - dist;
                        let nx = dx / dist, ny = dy / dist;
                        
                        // Positional resolution (separate them)
                        a.x -= nx * (overlap / 2.1); a.y -= ny * (overlap / 2.1);
                        b.x += nx * (overlap / 2.1); b.y += ny * (overlap / 2.1);

                        let speedA = Math.hypot(a.vx, a.vy);
                        let speedB = Math.hypot(b.vx, b.vy);
                        if (speedA < 1.0 && speedB < 1.0) continue; 

                        let atk = speedA > speedB ? a : b;
                        let def = speedA > speedB ? b : a;

                        applyHit(atk, def);
                    }
                }
            }
        }

        function applyHit(atk, def) {
            let isPlayerTurn = (gameState === 'MOVING' && activeEnemy === null);
            let defImmune = false;

            // Damage / Special Logic
            if (def.isPlayer && def.hasShield && !isPlayerTurn) {
                defImmune = true; 
            } else if (!def.isPlayer && def.type === '10' && def.hp > 1) {
                def.hp--;
                defImmune = true;
                spawnParticles(def.x, def.y, 'hit', 3, ['#aaa', '#fff']);
            } else if (!def.isPlayer && def.hasShield) {
                defImmune = true;
                def.hasShield = false;
                spawnParticles(def.x, def.y, 'hit', 5, ['#0ff']);
            } else if (!def.isPlayer && isProtectedByAura(def)) {
                if (!atk.isPlayer) defImmune = true; 
            }

            // Splitting Y
            if (!def.isPlayer && def.type === 'Y') {
                def.dead = true;
                for(let i=0; i<2; i++) {
                    let nE = new Entity(def.x + (i===0?-10:10), def.y, 'I');
                    nE.vx = (Math.random()-0.5)*5; nE.vy = (Math.random()-0.5)*5;
                    entities.push(nE);
                }
            }

            let piercing = (atk.isPlayer && atk.hasOverdrive);

            // Push Defender
            if (!defImmune) {
                let factor = 0.5; // Always push at 50%
                def.vx += atk.vx * factor;
                def.vy += atk.vy * factor;
            }

            // Recoil Attacker
            if (!piercing) {
                atk.vx *= -0.3;
                atk.vy *= -0.3;
            } else {
                atk.vx *= 0.9;
                atk.vy *= 0.9;
            }
        }

        function evaluateStops() {
            // Check Bomba
            if (player.hasBomb) {
                let hitAny = false;
                entities.forEach(e => {
                    if (!e.isPlayer && !e.dead && Math.hypot(e.x - player.x, e.y - player.y) <= player.bombRadius) {
                        let angle = Math.atan2(e.y - player.y, e.x - player.x);
                        e.vx += Math.cos(angle) * 18;
                        e.vy += Math.sin(angle) * 18;
                        hitAny = true;
                    }
                });
                player.hasBomb = false;
                if(hitAny) return true; // Movement continues
            }

            // Check X explosions
            let exploded = false;
            entities.forEach(e => {
                if (!e.isPlayer && e.type === 'X' && !e.dead) {
                    if (Math.hypot(player.x - e.x, player.y - e.y) <= e.dangerRadius) {
                        let angle = Math.atan2(player.y - e.y, player.x - e.x);
                        player.vx += Math.cos(angle) * 25; // Big push
                        player.vy += Math.sin(angle) * 25;
                        e.dead = true;
                        spawnParticles(e.x, e.y, 'exp', 20, ['#f00', '#ff0']);
                        exploded = true;
                    }
                }
            });
            if (exploded) return true;

            // Check U shields
            entities.forEach(e => {
                if (!e.isPlayer && e.type === 'U' && !e.dead) {
                    entities.forEach(t => {
                        if (!t.isPlayer && t.type !== 'H' && t.type !== 'U' && !t.dead) {
                            if (Math.hypot(t.x - e.x, t.y - e.y) <= e.auraRadius) {
                                t.hasShield = true;
                            }
                        }
                    });
                }
            });

            return false;
        }

        function manageTurns() {
            if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'NEXT_LEVEL') return;

            // Movement & Physics
            let movingCount = 0;
            entities.forEach(e => {
                if (e.dead) return;

                // S type snake movement
                if (e.isSnake && e.isMoving()) {
                    e.tick++;
                    let dir = Math.atan2(e.vy, e.vx);
                    let latDir = dir + Math.PI/2;
                    let waveForce = Math.sin(e.tick * 0.2) * 5;
                    e.x += Math.cos(latDir) * waveForce;
                    e.y += Math.sin(latDir) * waveForce;
                }

                e.x += e.vx; e.y += e.vy;
                e.vx *= FRICTION; e.vy *= FRICTION;
                
                if (Math.abs(e.vx) < MIN_VELOCITY) e.vx = 0;
                if (Math.abs(e.vy) < MIN_VELOCITY) e.vy = 0;
                
                if (e.isMoving()) movingCount++;
            });

            handleCollisions();

            // Collect Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                if (Math.hypot(player.x - p.x, player.y - p.y) < RADIUS * 2) {
                    if (p.type === '*') player.hasOverdrive = true;
                    if (p.type === 'x') player.hasBomb = true;
                    if (p.type === '^') player.movesLeft += 1;
                    if (p.type === 'o') player.hasShield = true;
                    powerups.splice(i, 1);
                }
            }

            // OOB Deaths (Only evaluate when stopped to avoid weird visual glitches while zooming out)
            entities.forEach(e => {
                if (!e.dead && !isPointInPoly({x: e.x, y: e.y}) && !e.isMoving()) {
                    e.dead = true;
                    leaveDeadCorpse(e.x, e.y);
                    spawnParticles(e.x, e.y, 'death', 10, ['#f00', '#a00']);
                }
            });

            entities = entities.filter(e => !e.dead);

            // Win/Loss
            if (!entities.includes(player)) { gameState = 'GAME_OVER'; return; }
            let enemies = entities.filter(e => !e.isPlayer);
            if (enemies.length === 0 && movingCount === 0) { gameState = 'NEXT_LEVEL'; currentLevel++; return; }

            if (movingCount > 0) {
                if (gameState !== 'MOVING') gameState = 'MOVING';
                return;
            }

            // Once everything is stopped
            if (gameState === 'MOVING') {
                let continued = evaluateStops();
                if (continued) return; // Keep moving due to explosions/bombs

                if (activeEnemy === null) {
                    // Player's move just finished
                    if (player.movesLeft > 0) {
                        gameState = 'PLAYER_TURN';
                    } else {
                        player.hasOverdrive = false; // Reset 1-turn buffs
                        enemyQueue = entities.filter(e => !e.isPlayer).sort((a,b) => a.y - b.y);
                        gameState = 'ENEMY_TURN';
                    }
                } else {
                    // Enemy's move just finished
                    if (!activeEnemy.dead && activeEnemy.movesLeft > 0) {
                        executeEnemyMove(activeEnemy);
                    } else {
                        activeEnemy = null;
                        gameState = 'ENEMY_TURN';
                    }
                }
            }

            if (gameState === 'ENEMY_TURN') {
                if (enemyQueue.length > 0) {
                    activeEnemy = enemyQueue.shift();
                    if(!activeEnemy.dead) {
                        activeEnemy.movesLeft--;
                        executeEnemyMove(activeEnemy);
                    }
                } else {
                    activeEnemy = null;
                    player.movesLeft = 1;
                    player.hasShield = false; 
                    gameState = 'PLAYER_TURN';
                }
            }
        }

        function executeEnemyMove(enemy) {
            let dx = player.x - enemy.x;
            let dy = player.y - enemy.y;
            let dist = Math.hypot(dx, dy);
            
            let power = enemy.power * 8; // base speed multiplier
            enemy.vx = (dx / dist) * power;
            enemy.vy = (dy / dist) * power;
            enemy.tick = 0;
            gameState = 'MOVING';
        }

        function drawMagmaAndMap() {
            // Draw Magma everywhere
            ctx.fillStyle = '#030';
            ctx.font = `14px 'Courier New', monospace`;
            let time = Date.now() / 200;
            magmaGrid.forEach(cell => {
                if ((cell.offset + time) % 20 < 1) {
                    cell.char = "01#$%&@*+/\\~"[Math.floor(Math.random() * 12)];
                }
                ctx.fillStyle = ((cell.offset + time) % 100 < 50) ? '#050' : '#040';
                ctx.fillText(cell.char, cell.x, cell.y);
            });

            // Draw Black map polygon over it
            if (mapPolygon.length > 0) {
                ctx.beginPath();
                ctx.moveTo(mapPolygon[0].x, mapPolygon[0].y);
                for(let i=1; i<mapPolygon.length; i++) ctx.lineTo(mapPolygon[i].x, mapPolygon[i].y);
                ctx.closePath();
                ctx.fillStyle = '#000'; ctx.fill();
                ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; ctx.stroke();
            }

            // Draw dead particles
            ctx.fillStyle = '#800'; // Dark red
            ctx.font = `bold 14px 'Courier New', monospace`;
            deadParticles.forEach(p => { ctx.fillText(p.char, p.x, p.y); });
        }

        function drawHUD() {
            ctx.fillStyle = '#0f0';
            ctx.font = `bold 20px 'Courier New', monospace`;
            ctx.textAlign = 'left';
            ctx.fillText(`SISTEMA NIVEL: ${currentLevel}`, 20, 30);
            
            let enemyCount = entities.filter(e => !e.isPlayer).length;
            ctx.textAlign = 'right';
            ctx.fillText(`AMENAZAS: ${enemyCount}`, width - 20, 30);
            
            ctx.textAlign = 'center';
            if (gameState === 'PLAYER_TURN') {
                ctx.fillText("> ESPERANDO_INPUT (Tu Turno)", cx, 30);
                if (player && player.movesLeft > 1) {
                    ctx.fillStyle = '#ff0'; ctx.fillText(`[ Lanzamientos: ${player.movesLeft} ]`, cx, 60);
                }
            } else if (gameState === 'ENEMY_TURN' || (gameState === 'MOVING' && activeEnemy)) {
                ctx.fillStyle = '#f00'; ctx.fillText("> ENEMIGO EJECUTANDO...", cx, 30);
            }

            // Overlay Screens
            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,width,height);
                ctx.fillStyle = '#0f0'; ctx.font = `bold 40px 'Courier New', monospace`;
                ctx.fillText("ASCII VIRUS: INYECCIÓN", cx, cy - 60);
                ctx.font = `20px 'Courier New', monospace`;
                ctx.fillText("Arrastra desde el virus [@] para impulsarte.", cx, cy);
                ctx.fillText("Empuja enemigos fuera del borde verde (magma) para destruirlos.", cx, cy + 30);
                ctx.fillText("- CLICK PARA INICIAR -", cx, cy + 80);
            } else if (gameState === 'GAME_OVER') {
                ctx.fillStyle = 'rgba(255,0,0,0.4)'; ctx.fillRect(0,0,width,height);
                ctx.fillStyle = '#f00'; ctx.font = `bold 50px 'Courier New', monospace`;
                ctx.fillText("SISTEMA PURGADO", cx, cy - 20);
                ctx.font = `24px 'Courier New', monospace`;
                ctx.fillText("El virus fue eliminado.", cx, cy + 30);
                ctx.fillText("- CLICK PARA REINICIAR -", cx, cy + 80);
            } else if (gameState === 'NEXT_LEVEL') {
                ctx.fillStyle = 'rgba(0,255,0,0.3)'; ctx.fillRect(0,0,width,height);
                ctx.fillStyle = '#0f0'; ctx.font = `bold 50px 'Courier New', monospace`;
                ctx.fillText("NODO COMPROMETIDO", cx, cy - 20);
                ctx.font = `24px 'Courier New', monospace`;
                ctx.fillText("Avanzando a siguiente sector...", cx, cy + 30);
                ctx.fillText("- CLICK PARA CONTINUAR -", cx, cy + 80);
            }
        }

        function updateTooltip() {
            if (hoveredEntity && gameState !== 'START' && gameState !== 'GAME_OVER' && gameState !== 'NEXT_LEVEL') {
                let name = "", desc = "";
                if (hoveredEntity.isPlayer) {
                    name = "Virus"; desc = "Tú. Arrastra para moverte.";
                } else if (hoveredEntity.type && ENEMY_DEFS[hoveredEntity.type]) {
                    name = hoveredEntity.type === '10' ? "Enemigo 10" : `Enemigo ${hoveredEntity.type}`;
                    desc = ENEMY_DEFS[hoveredEntity.type].desc;
                } else if (POWERUP_DEFS[hoveredEntity.type]) {
                    name = `Powerup: ${POWERUP_DEFS[hoveredEntity.type].name}`;
                    desc = POWERUP_DEFS[hoveredEntity.type].desc;
                }

                tooltip.innerHTML = `<strong>${name}</strong>${desc}`;
                tooltip.style.display = 'block';
                
                let tx = mouse.x + 15; let ty = mouse.y + 15;
                if (tx + 300 > width) tx = mouse.x - tooltip.offsetWidth - 15;
                if (ty + 100 > height) ty = mouse.y - tooltip.offsetHeight - 15;
                
                tooltip.style.left = tx + 'px';
                tooltip.style.top = ty + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        }

        function gameLoop() {
            globalTick++;
            ctx.clearRect(0, 0, width, height);
            
            drawMagmaAndMap();
            
            if (gameState !== 'START') {
                powerups.forEach(p => p.draw());
                entities.forEach(e => e.draw());
                
                // Draw Slingshot
                if (gameState === 'PLAYER_DRAG' && player) {
                    let dx = player.x - mouse.x; let dy = player.y - mouse.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > MAX_DRAG) { dx = (dx/dist)*MAX_DRAG; dy = (dy/dist)*MAX_DRAG; }
                    
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x + dx, player.y + dy);
                    ctx.strokeStyle = player.hasOverdrive ? '#ff0' : '#0ff';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Update & Draw Particles
                ctx.font = `bold 12px 'Courier New', monospace`;
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.9; p.vy *= 0.9;
                    p.life -= p.decay;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillText(p.char, p.x, p.y);
                }
                ctx.globalAlpha = 1.0;

                manageTurns();
            }

            drawHUD();
            updateTooltip();
            
            requestAnimationFrame(gameLoop);
        }

        resize();
        gameLoop();
    </script>
</body>
</html>
